<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>TrueDoc Admin Overview</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1152d4",
                        "background-dark": "#101622"
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    }
                }
            }
        };
    </script>
    <style>
        body {
            font-family: "Inter", sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="min-h-screen bg-[#f6f6f8] pb-24 text-slate-900 antialiased dark:bg-background-dark dark:text-white md:pb-0">
    <header class="fixed top-0 z-50 w-full bg-white/80 backdrop-blur-xl shadow-sm dark:bg-slate-900/80">
        <div class="flex w-full items-center justify-between px-6 py-4">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-blue-700 dark:text-blue-400">shield_lock</span>
                <span class="text-xl font-black uppercase tracking-tighter text-blue-800 dark:text-blue-200">TrueDoc</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="hidden items-center gap-8 mr-8 md:flex">
                    <a class="text-blue-700 dark:text-blue-400 font-bold text-sm uppercase tracking-widest" href="superuser.html">Home</a>
                    <a class="text-slate-500 dark:text-slate-400 font-bold text-sm uppercase tracking-widest hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors px-3 py-2 rounded-lg" href="upload.html">Upload</a>
                    <a class="text-slate-500 dark:text-slate-400 font-bold text-sm uppercase tracking-widest hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors px-3 py-2 rounded-lg" href="verify.html">Verify</a>
                </div>
                <div data-user-badge class="hidden rounded-full bg-slate-100 px-4 py-2 text-[11px] font-bold uppercase tracking-[0.2em] text-slate-500 sm:block dark:bg-slate-800">Secure Session</div>
                <button data-auth-cta class="flex h-10 items-center justify-center rounded-full bg-primary px-4 text-xs font-bold text-white transition-all">Logout</button>
            </div>
        </div>
    </header>

    <main class="mx-auto mb-20 max-w-7xl px-6 pt-24 md:px-12">
        <div class="mb-12 flex flex-col justify-between gap-6 md:flex-row md:items-end">
            <div>
                <span class="mb-2 block text-[0.6875rem] font-bold uppercase tracking-[0.05em] text-slate-500 dark:text-slate-400">System Overview</span>
                <h1 class="text-4xl font-black tracking-tight text-slate-950 dark:text-white md:text-5xl">Admin Terminal</h1>
            </div>
            <div class="flex gap-3">
                <div class="flex items-center gap-2 rounded-full bg-slate-100 px-4 py-2 dark:bg-slate-800">
                    <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="liveStatusLabel" class="text-[0.6875rem] font-bold uppercase tracking-[0.05em] text-slate-500 dark:text-slate-400">Loading Network</span>
                </div>
            </div>
        </div>

        <div class="mb-12 grid grid-cols-1 gap-6 md:grid-cols-3">
            <div class="flex flex-col justify-between rounded-2xl bg-white p-8 shadow-[0px_12px_24px_rgba(26,28,29,0.04)] dark:bg-slate-900">
                <div>
                    <span class="material-symbols-outlined mb-4 text-primary">lan</span>
                    <h3 class="text-[0.75rem] font-bold uppercase tracking-[0.05em] text-slate-500 dark:text-slate-400">Blockchain Status</h3>
                </div>
                <div class="mt-8 flex items-baseline gap-2">
                    <span id="blockchainMetric" class="text-5xl font-black tracking-tighter">...</span>
                    <span id="blockchainMetricNote" class="font-bold text-emerald-600 dark:text-emerald-400">Checking</span>
                </div>
            </div>

            <div class="flex flex-col justify-between rounded-2xl bg-primary p-8 text-white shadow-[0px_12px_24px_rgba(17,82,212,0.12)]">
                <div>
                    <span class="material-symbols-outlined mb-4">account_balance</span>
                    <h3 class="text-[0.75rem] font-bold uppercase tracking-[0.05em] opacity-80">Registered Issuers</h3>
                </div>
                <div class="mt-8">
                    <span id="issuerMetric" class="text-5xl font-black tracking-tighter">0</span>
                    <div class="mt-4 h-1 w-full overflow-hidden rounded-full bg-white/20">
                        <div id="issuerMetricBar" class="h-full w-0 rounded-full bg-white"></div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col justify-between rounded-2xl bg-white p-8 shadow-[0px_12px_24px_rgba(26,28,29,0.04)] dark:bg-slate-900">
                <div>
                    <span class="material-symbols-outlined mb-4 text-primary">shield_person</span>
                    <h3 class="text-[0.75rem] font-bold uppercase tracking-[0.05em] text-slate-500 dark:text-slate-400">Access Mode</h3>
                </div>
                <div class="mt-8">
                    <span class="text-5xl font-black tracking-tighter">Admin</span>
                    <span class="mt-2 block text-sm font-medium text-slate-500 dark:text-slate-400">Protected system overview</span>
                </div>
            </div>
        </div>

        <section class="mb-12">
            <div class="mb-6 flex items-center justify-between">
                <h2 class="text-2xl font-black tracking-tight">Registered Issuers</h2>
            </div>

            <div id="issuerCards" class="space-y-4 hidden md:block"></div>

            <div id="issuerCardsMobile" class="space-y-4 md:hidden"></div>

            <div id="emptyUsers" class="hidden rounded-2xl border border-dashed border-slate-200 bg-white px-4 py-10 text-center text-sm text-slate-500 dark:border-slate-800 dark:bg-slate-900">
                No issuer accounts have signed up yet.
            </div>
        </section>
    </main>

    <div id="navbar-container"></div>

    <script src="../js/apiConfig.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/superuser.js"></script>
    <script>
        (async () => {
            const user = await requireAuthenticatedUser(["superuser"]);
            if (!user) {
                return;
            }

            updateAuthUI();
            loadNavbar();
            loadSuperuserOverview();
        })();
    </script>
</body>
</html>
