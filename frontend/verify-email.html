<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Verify Email - TrueDoc</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#1152d4", "background-dark": "#101622" },
                    fontFamily: { "display": ["Inter"] }
                }
            }
        };
    </script>
</head>
<body class="bg-[#f6f6f8] dark:bg-background-dark font-display text-slate-900 dark:text-white">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-lg overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl dark:border-slate-800 dark:bg-slate-900">
            <div class="bg-primary p-6 text-white">
                <div class="sm:hidden">
                    <div class="flex items-start justify-between gap-4">
                        <div>
                            <p class="text-[10px] font-bold uppercase tracking-[0.24em] text-blue-100">Status Mobile</p>
                            <p class="mt-2 text-2xl font-black leading-tight">One screen, one answer.</p>
                        </div>
                        <div class="flex size-12 items-center justify-center rounded-2xl border border-white/15 bg-white/10">
                            <span class="material-symbols-outlined">mark_email_read</span>
                        </div>
                    </div>
                </div>
                <div class="hidden sm:block">
                    <h1 class="text-2xl font-black">Verify your email</h1>
                    <p class="mt-2 text-sm text-blue-100">TrueDoc will activate issuer access after successful verification.</p>
                </div>
            </div>
            <div class="p-6 sm:p-8">
                <div id="statusCard" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-4 text-sm font-medium text-slate-700 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200">
                    Checking verification token...
                </div>
                <div class="mt-6 flex flex-col gap-3 sm:flex-row">
                    <a href="auth.html" class="inline-flex w-full items-center justify-center rounded-2xl bg-primary px-4 py-3 text-sm font-bold text-white sm:w-auto">Go to login</a>
                    <a href="index.html" class="inline-flex w-full items-center justify-center rounded-2xl border border-slate-200 px-4 py-3 text-sm font-bold text-slate-700 dark:border-slate-700 dark:text-slate-200 sm:w-auto">Back home</a>
                </div>
            </div>
        </div>
    </div>
    <script src="js/apiConfig.js"></script>
    <script src="js/auth.js"></script>
    <script>
        (async () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get("token");
            const statusCard = document.getElementById("statusCard");

            if (!token) {
                statusCard.className = "rounded-2xl border border-red-200 bg-red-50 px-4 py-4 text-sm font-medium text-red-600";
                statusCard.textContent = "Missing verification token.";
                return;
            }

            try {
                const data = await verifyEmailTokenRequest(token);
                statusCard.className = "rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-4 text-sm font-medium text-emerald-700";
                statusCard.textContent = `Email verified for ${data.user.email}. You can now access the issuer portal.`;
            } catch (error) {
                statusCard.className = "rounded-2xl border border-red-200 bg-red-50 px-4 py-4 text-sm font-medium text-red-600";
                statusCard.textContent = error.message;
            }
        })();
    </script>
</body>
</html>
